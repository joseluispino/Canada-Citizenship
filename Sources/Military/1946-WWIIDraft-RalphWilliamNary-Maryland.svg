<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)"/>
  
  <!-- Outer Card Frame -->
  <rect x="30" y="30" width="940" height="590" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Header Bar -->
  <rect x="30" y="30" width="940" height="85" rx="16" fill="#0369a1" fill-opacity="0.35"/>
  <text x="60" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">🍁 CANADIAN CITIZENSHIP EVIDENTIARY ARCHIVE</text>
  <text x="60" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">VERIFIED PRIMARY FACSIMILE &amp; PROVENANCE RECORD • BILL C-3 / S-245</text>
  
  <!-- Document Title Box -->
  <rect x="60" y="135" width="880" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="80" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f8fafc">Selective Service System WWII Draft Registration Card</text>
  
  <!-- Metadata Grid -->
  <!-- Row 1: Date & Location -->
  <rect x="60" y="210" width="425" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">📅 RECORD DATE</text>
  <text x="75" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#f1f5f9">September 26, 1946</text>
  
  <rect x="515" y="210" width="425" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="530" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">📍 JURISDICTION &amp; PLACE</text>
  <text x="530" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#f1f5f9">Selective Service Local Board No. 1, Bethesda, Montgomery County, Maryland</text>
  
  <!-- Row 2: Archival Reference -->
  <rect x="60" y="300" width="880" height="75" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🏛️ ARCHIVAL CUSTODY &amp; REPOSITORY HOLD</text>
  <text x="75" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">NARA Record Group 147, Microfilm Roll 2568865, ARK: 1:1:Q29C-NRM4</text>
  
  <!-- Row 3: Extracted Vital Proof -->
  <rect x="60" y="390" width="880" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#4ade80">📄 EXTRACTED PRIMARY FACTS &amp; LINEAGE</text>
  <text x="75" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#f8fafc">Registrant: Ralph William Nary | DoB: Sept 2, 1928 (Pittsburgh, PA) | Age: 18</text>
  <text x="75" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Person who will always know your address: E. R. Nary (Father), Adams, MA / Pittsburgh, PA</text>

  <!-- Row 4: Statutory Legal Nexus -->
  <rect x="60" y="500" width="880" height="85" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="75" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc">⚖️ BILL C-3 / S-245 STATUTORY CITIZENSHIP NEXUS</text>
  <text x="75" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Federal Vital Verification of Dr. Ralph William Nary and Paternal Link</text>
  
  <!-- Security Seal Badge -->
  <circle cx="900" cy="72" r="22" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="900" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#22c55e">✓</text>
</svg>
